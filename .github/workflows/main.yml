name: Auto Create PR for DB Changes
on:
  push:
    branches:
      - Development
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  createPullRequest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "PR for database related changes"
          title: "Auto PR Database changes"
          body: "Auto-generated PR from development."
          branch: Development
          base: main
          assignees: |
            ankurbanga4050
            rohitranout889
          reviewers: |
            ankurbanga4050
            rohitranout889
