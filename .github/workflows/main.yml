name: Auto Create PR for DB Changes
on:
  push:
    branches:
      - Development
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
jobs:
  createPullRequest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: PR for database related changes
          title: Auto PR Database changes
          body: Auto-generated PR from development.
          branch: Development
          base: main
          assignees: |
            ankurbanga4050
            rohitranout889
          reviewers: |
            ankurbanga4050
            rohitranout889
