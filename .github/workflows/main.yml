name: Auto Create PR for DB Changes

on:
  push:
    branches:
      - development

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: development
          title: "Auto PR: Database schema changes"
          body: "Auto-generated PR from development."
          reviewers: |
            ankurbanga4050
            rohitranout889
